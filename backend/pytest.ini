# pytest configuration for the backend suite.
#
# `pythonpath = .` lets tests import `app` without an installed package, and the
# explicit asyncio mode keeps an accidental `async def` test from being silently
# skipped.

[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: bounded-runtime tests that are still worth running before a release
